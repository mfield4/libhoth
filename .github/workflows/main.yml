# This is a basic workflow to help you get started with Actions

name: Build project

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      static_link:
        description: 'Statically link Linux htool binary'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: 'ubuntu-24.04'
            arch: 'amd64'
          - runner: 'ubuntu-24.04-arm'
            arch: 'arm64'
    runs-on: ${{ matrix.runner }}

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install extra packages
        run: |
          sudo apt-get update
          sudo apt-get install meson libusb-1.0-0-dev libsystemd-dev libcap-dev

      # Runs a set of commands using the runners shell
      - name: Build with Meson
        run: |
          meson build --werror
          (cd build && ninja)

      - name: Build with Bazel
        run: |
          bazel build --copt="-Werror" ${{ inputs.static_link && '--config=static' || '' }} ...

      - name: Build htool with D-Bus
        run: |
          bazel build --define dbus_backend=true  //examples:htool

      - name: Bazel tests
        run: |
          bazel test ...

  build-macos:
    runs-on: 'macos-15'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No -Werror yet: format strings such as "%lx" for uint64_t and the
      # upstream libusb darwin backend both emit warnings on macOS.
      - name: Build with Bazel
        run: |
          bazel build ...

      - name: Smoke test htool
        run: |
          bazel-bin/examples/htool --version

      - name: Bazel tests
        run: |
          bazel test --test_output=errors ...
