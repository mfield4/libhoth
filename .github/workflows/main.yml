# This is a basic workflow to help you get started with Actions

name: Build project

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      static_link:
        description: 'Statically link Linux htool binary'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: 'ubuntu-24.04'
            arch: 'amd64'
          - runner: 'ubuntu-24.04-arm'
            arch: 'arm64'
    runs-on: ${{ matrix.runner }}

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install extra packages
        run: |
          sudo apt-get update
          sudo apt-get install meson libusb-1.0-0-dev libsystemd-dev libcap-dev

      # Runs a set of commands using the runners shell
      - name: Build with Meson
        run: |
          meson build --werror
          (cd build && ninja)

      - name: Build with Bazel
        run: |
          bazel build --copt="-Werror" ${{ inputs.static_link && '--config=static' || '' }} ...

      - name: Build htool with D-Bus
        run: |
          bazel build --define dbus_backend=true  //examples:htool

      - name: Bazel tests
        run: |
          bazel test ...

      - name: Prepare release binary
        run: |
          bazel build -c opt --copt="-Werror" ${{ inputs.static_link && '--config=static' || '' }} //examples:htool
          cp bazel-bin/examples/htool htool-linux-${{ matrix.arch }}

      - name: Upload htool binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: htool-linux-${{ matrix.arch }}
          path: htool-linux-${{ matrix.arch }}

  build-macos:
    runs-on: 'macos-15'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No -Werror yet: format strings such as "%lx" for uint64_t and the
      # upstream libusb darwin backend both emit warnings on macOS.
      - name: Build with Bazel
        run: |
          bazel build ...

      - name: Smoke test htool
        run: |
          bazel-bin/examples/htool --version

      - name: Bazel tests
        run: |
          bazel test --test_output=errors ...

      - name: Prepare release binary
        run: |
          bazel build -c opt //examples:htool
          cp bazel-bin/examples/htool htool-macos-arm64

      - name: Upload htool binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: htool-macos-arm64
          path: htool-macos-arm64

  release:
    needs: [build, build-macos]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: 'ubuntu-24.04'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x release-assets/htool-*
          (cd release-assets && sha256sum htool-* > sha256sums.txt)
          latest_tag=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          if [ -z "$latest_tag" ]; then
            next_tag="v0.0.1"
          else
            version="${latest_tag#v}"
            major="${version%%.*}"
            rest="${version#*.}"
            minor="${rest%%.*}"
            patch="${rest#*.}"
            next_tag="v${major}.${minor}.$((patch + 1))"
          fi
          gh release create "$next_tag" \
            --target "${{ github.sha }}" \
            --title "$next_tag" \
            --generate-notes \
            release-assets/*
